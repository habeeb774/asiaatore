<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>Test Login - متجر آسيا</h2>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" value="admin@example.com" required>
        </div>
        <div class="form-group">
            <label for="password">كلمة المرور:</label>
            <input type="password" id="password" value="admin123" required>
        </div>
        <button type="submit">تسجيل الدخول</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ identifier: email, password })
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ تسجيل الدخول بنجاح!</h3>
                        <p><strong>Token:</strong> ${data.accessToken.substring(0, 50)}...</p>
                        <p><strong>User ID:</strong> ${data.user.id}</p>
                        <p><strong>Email:</strong> ${data.user.email}</p>
                        <p><strong>Role:</strong> ${data.user.role}</p>
                        <p><strong>Name:</strong> ${data.user.name}</p>
                    `;
                    
                    // Store token for testing
                    localStorage.setItem('my_store_token', data.accessToken);
                    localStorage.setItem('my_store_user', JSON.stringify(data.user));
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ فشل تسجيل الدخول</h3>
                        <p><strong>Error:</strong> ${data.error || 'Unknown error'}</p>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ خطأ في الاتصال</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        });
        
        // Test current user endpoint
        async function testCurrentUser() {
            try {
                const response = await fetch('/api/auth/me', {
                    credentials: 'include'
                });
                const data = await response.json();
                console.log('Current user:', data);
            } catch (error) {
                console.error('Error fetching current user:', error);
            }
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            console.log('Testing current user...');
            testCurrentUser();
        });
    </script>
</body>
</html>
