    <!-- Keep Google Fonts as a fallback in non-local environments.
         Inject the external links only when not running on localhost to avoid
         DNS / fonts.gstatic.com failures during local development. -->
    <script>
      (function(){
        try{
          var host = (window && window.location && window.location.hostname) || '';
          // Treat localhost/127.0.0.1 and local network file URLs as dev — do not load remote fonts there.
          var isLocal = /(^localhost$)|(^127\.)|(^0:0:0:0:0:0:0:1$)/.test(host);
          if (!isLocal) {
            var head = document.getElementsByTagName('head')[0];
            var p1 = document.createElement('link');
            p1.rel = 'preconnect'; p1.href = 'https://fonts.googleapis.com';
            head.appendChild(p1);
            var p2 = document.createElement('link');
            p2.rel = 'preconnect'; p2.href = 'https://fonts.gstatic.com'; p2.crossOrigin = '';
            head.appendChild(p2);
            var p3 = document.createElement('link');
            p3.rel = 'preload'; p3.as = 'style'; p3.href = 'https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap';
            head.appendChild(p3);
            var p4 = document.createElement('link');
            p4.rel = 'stylesheet'; p4.href = 'https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap';
            head.appendChild(p4);
          }
        }catch(e){/* ignore */}
      })();
    </script>

    <!-- Preload hero LCP image if available in Salla settings; fallback to a safe default -->
    <script>
      (function(){
        try{
          var defaultHero = 'https://images.unsplash.com/photo-1607082350899-7e105aa886ae?auto=format&fit=crop&w=1200&q=70';
          function addPreload(href){
            try{
              if(!href) return;
              var l = document.createElement('link');
              l.rel = 'preload'; l.as = 'image'; l.href = href; l.crossOrigin = 'anonymous';
              document.head.appendChild(l);
            }catch(e){}
          }
          if (window.Salla && typeof Salla.onReady === 'function') {
            Salla.onReady(function(cfg){
              try{
                var hero = (cfg && cfg.settings && (cfg.settings.heroBackgroundImage || cfg.settings.heroCenterImage)) || defaultHero;
                addPreload(hero);
              }catch(e){}
            });
          } else {
            addPreload(defaultHero);
          }
        }catch(e){}
      })();
    </script>
    <!-- After initial parse: mark non-critical images as lazy, add responsive srcset hints if missing (basic heuristic) -->
    <script>
      (function(){
        try{
          var d = document;
          var heroPreloaded = new Set();
          Array.from(d.querySelectorAll('link[rel="preload"][as="image"]')).forEach(function(l){ heroPreloaded.add(l.getAttribute('href')); });
          function enhance(img){
            try{
              var src = img.getAttribute('src') || '';
              if (!src) return;
              // Skip hero (already eagerly fetched)
              if (heroPreloaded.has(src)) return;
              // Add lazy loading if not already
              if (!img.hasAttribute('loading')) img.setAttribute('loading','lazy');
              // If width/height absent but parent has fixed height, add decoding hint
              if (!img.hasAttribute('decoding')) img.setAttribute('decoding','async');
              if (!img.hasAttribute('alt')) img.setAttribute('alt','صورة منتج');
              // Simple srcset: attempt to derive smaller variant if CDN pattern matches (unsplash or salla) – non-destructive
              if (!img.hasAttribute('srcset')){
                if (/images\.unsplash\.com/.test(src)){
                  var base = src.replace(/(&?w=)\d+/,'');
                  img.setAttribute('srcset', base + '&w=400 400w, ' + base + '&w=800 800w');
                  img.setAttribute('sizes','(max-width:600px) 50vw, (max-width:1200px) 33vw, 25vw');
                }
              }
            }catch(e){}
          }
          function run(){ Array.from(d.getElementsByTagName('img')).forEach(enhance); }
          if (document.readyState === 'complete' || document.readyState === 'interactive') run(); else d.addEventListener('DOMContentLoaded', run);
          // Observe future additions
          var mo = new MutationObserver(function(muts){
            for (var m of muts){
              for (var n of m.addedNodes){
                if (n && n.tagName === 'IMG') enhance(n);
                else if (n && n.querySelectorAll){ n.querySelectorAll('img').forEach(enhance); }
              }
            }
          });
          mo.observe(d.documentElement || d.body, {childList:true, subtree:true});
        }catch(e){}
      })();
    </script>

    <!-- Canonical URL setter: normalize to origin + pathname (no query/hash) -->
    <script>
      (function(){
        try{
          var loc = window.location || {};
          var origin = loc.origin || (loc.protocol + '//' + loc.host);
          var path = (loc.pathname || '/').replace(/\/$/, '') || '/';
          var href = origin + path;
          var link = document.querySelector('link[rel="canonical"]');
          if (!link) { link = document.createElement('link'); link.setAttribute('rel','canonical'); (document.head||document.documentElement).appendChild(link); }
          link.setAttribute('href', href);

    <!-- Prefetching Home route removed: indexing/build previously produced a malformed replacement in dist/index.html on Windows builds.
         If you want to prefetch the Home chunk, add a safe <link rel="modulepreload"> to the generated asset in a post-build step.
         For now we avoid dynamic import() in index.html to prevent build-time string-replacement bugs. -->
    <!-- Avoid preloading non-essential vendor chunks like vendor.motion and vendor.leaflet
         This script removes modulepreload links that reference those chunk names so the
         browser doesn't fetch them eagerly during initial parse. We keep preloads for
         critical runtime bundles but drop heavy optional libs until they are needed. -->
    <script>
      (function(){
        try{
          // Run as early as possible to catch <link rel=modulepreload> injected by build
          const removeIfMatches = (link) => {
            try{
              const href = link.getAttribute('href') || '';
              if (/vendor\.motion|vendor\.leaflet/.test(href)) {
                link.parentNode && link.parentNode.removeChild(link);
              }
            }catch(e){}
          };
          // Remove existing
          Array.from(document.getElementsByTagName('link')).forEach(l => {
            if (l.rel === 'modulepreload') removeIfMatches(l);
          });
          // Observe for additions (Vite or other tooling may inject later)
          const mo = new MutationObserver(mutations => {
            for (const m of mutations) {
              for (const node of m.addedNodes) {
                if (node && node.tagName === 'LINK' && node.rel === 'modulepreload') removeIfMatches(node);
              }
            }
          });
          mo.observe(document.head || document.documentElement, { childList: true, subtree: true });
        }catch(e){/* no-op */}
      })();
    </script>

    <!-- Safe console.error wrapper inserted early to avoid devtool formatting crashes
         This runs before Vite's injected client and the app entry so it can
         capture and safely stringify arguments that would otherwise cause
         `String(obj)` TypeErrors in the dev tooling. -->
    <script>
      (function(){
        try{
          if (typeof window !== 'undefined' && typeof console !== 'undefined') {
            window.__capturedConsoleErrors = window.__capturedConsoleErrors || [];
            var origError = console.error.bind(console);
            function safeReplacer(key, value){
              try{
                if (typeof value === 'symbol') return value.toString();
                if (typeof value === 'function') return '[Function:' + (value.name || 'anonymous') + ']';
                return value;
              }catch(e){ return String(value); }
            }
            function safeStringify(obj){
              try{ if (typeof obj === 'string') return obj; return JSON.stringify(obj, safeReplacer, 2); }catch(e){ try{return String(obj);}catch(e2){return Object.prototype.toString.call(obj);} }
            }
            console.error = function(){
              try{
                var args = Array.prototype.slice.call(arguments || []);
                var safe = args.map(function(a){ return safeStringify(a); });
                try{ window.__capturedConsoleErrors.push({ ts: Date.now(), args: safe }); }catch(e){}
                origError.apply(null, args);
              }catch(e){ try{ origError('console.error wrapper failed', e); }catch(e2){} }
            };
          }
        }catch(e){}
      })();
      // Global handlers to capture uncaught errors and promise rejections
      (function(){
        try{
          window.__capturedConsoleErrors = window.__capturedConsoleErrors || [];
          window.__lastWindowError = null;
          window.onerror = function(message, source, lineno, colno, err){
            try{
              var stack = err && err.stack ? err.stack : (message && message.stack) || null;
              var payload = { ts: Date.now(), type: 'error', message: String(message), source: source || null, lineno: lineno||null, colno: colno||null, stack: stack };
              try{ window.__capturedConsoleErrors.push(payload); }catch(e){}
              window.__lastWindowError = payload;
            }catch(e){}
          };
          window.addEventListener('unhandledrejection', function(evt){
            try{
              var reason = evt && evt.reason;
              var stack = reason && reason.stack ? reason.stack : null;
              var msg = reason && reason.message ? reason.message : String(reason);
              var payload = { ts: Date.now(), type: 'unhandledrejection', message: msg, reason: payloadReasonToString(reason), stack };
              try{ window.__capturedConsoleErrors.push(payload); }catch(e){}
            }catch(e){}
          });
          function payloadReasonToString(r){
            try{ if (typeof r === 'string') return r; if (r && r.message) return r.message; return JSON.stringify(r); }catch(e){ try{return String(r);}catch(e2){return Object.prototype.toString.call(r);} }
          }
        }catch(e){}
      })();
    </script>

    <!-- Re-wrap console.error after Vite and app initialization to ensure
         we capture/format arguments safely and avoid devtools formatting
         code throwing. This runs slightly deferred to let Vite install its
         hooks and then replace them with a safe wrapper. -->
    <script>
      setTimeout(function(){
        try{
          if (typeof window === 'undefined' || typeof console === 'undefined') return;
          window.__capturedConsoleErrors = window.__capturedConsoleErrors || [];
          var previous = console.error && console.error.bind(console);
          function safeReplacer(key, value){
            try{
              if (typeof value === 'symbol') return value.toString();
              if (typeof value === 'function') return '[Function:' + (value.name || 'anonymous') + ']';
              return value;
            }catch(e){ return String(value); }
          }
          function safeStringify(obj){
            try{ if (typeof obj === 'string') return obj; return JSON.stringify(obj, safeReplacer, 2); }catch(e){ try{return String(obj);}catch(e2){return Object.prototype.toString.call(obj);} }
          }
          console.error = function(){
            try{
              var args = Array.prototype.slice.call(arguments || []);
              var safe = args.map(function(a){ return safeStringify(a); });
              try{ window.__capturedConsoleErrors.push({ ts: Date.now(), args: safe }); }catch(e){}
              // Call the previous implementation but pass a safe single-string
              if (previous) previous(safe.join(' '));
            }catch(e){ try{ if (previous) previous('console.error rewrap failed', e); }catch(e2){} }
          };
        }catch(e){}
      }, 50);
    </script>
