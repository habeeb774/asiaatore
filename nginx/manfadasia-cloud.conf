## NGINX configuration for current project (React/Vite frontend + Express API)
## Domains: manfadasia.cloud (apex) + www.manfadasia.cloud (redirect)
## Adjust certificate paths and root to match your server layout.

# ----------------------------------------------
# 1. Redirect www → apex & force HTTPS
# ----------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    http3 off; # Set to 'on' if enabling QUIC

    server_name www.manfadasia.cloud;

    # SSL certificate paths for manfadasia.cloud
    ssl_certificate     /etc/letsencrypt/live/manfadasia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manfadasia.cloud/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/manfadasia.cloud/chain.pem;

    # Redirect all variants to apex HTTPS
    return 301 https://manfadasia.cloud$request_uri;
}

# ----------------------------------------------
# 2. Primary site (apex)
# ----------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    http3 off;  # set to 'on' if enabling quic

    server_name manfadasia.cloud www1.manfadasia.cloud; # include any additional subdomain variants if needed

    ssl_certificate     /etc/letsencrypt/live/manfadasia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manfadasia.cloud/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/manfadasia.cloud/chain.pem;

    # Strong TLS & security headers (align with Express middleware)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'EECDH+AESGCM:EECDH+CHACHA20:!AES128-SHA:!AES256-SHA:!RC4:!3DES:!MD5:!DSS';
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-site always;
    # Uncomment only if ALL embedded cross-origin resources send CORP headers
    # add_header Cross-Origin-Embedder-Policy require-corp always;

    # Logging (adjust paths / log format as needed)
    access_log /var/log/nginx/manfadasia.access.log combined;
    error_log  /var/log/nginx/manfadasia.error.log warn;

    # ACME challenge (allow cert renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;  # ensure directory exists or adjust for certbot
        try_files $uri =404;
        auth_basic off;
        allow all;
    }

    # Enforce HTTPS if somehow hit over plain HTTP (after listen 80)
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }

    # Frontend built assets root (adjust path to deployed dist)
    root /var/www/mystore/client/dist;
    index index.html;

    # Include global tuning (optional):
    # include /etc/nginx/global_settings;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Static asset caching (fingerprinted files)
    location ~* \.(?:js|css|woff2|woff|ttf|svg|png|jpe?g|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Short cache for PWA / service worker
    location = /manifest.webmanifest { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /sw.js               { add_header Cache-Control "public, max-age=900";   try_files $uri =404; }

    # API proxy (backend Express listening on dynamic port 8829+; adjust if different)
    location /api/ {
        proxy_pass http://127.0.0.1:8829/;  # if auto-increment logic picks another port update here
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Disable caching for dynamic API responses
        add_header Cache-Control "no-store";
        proxy_connect_timeout 30;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }

    # SSE events endpoint (keep connection open)
    location /api/events {
        proxy_pass http://127.0.0.1:8829/api/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket / upgrade support (if backend uses upgrade, e.g. future realtime)
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    location /ws/ {
        proxy_pass http://127.0.0.1:8829/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
