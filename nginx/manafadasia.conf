## NGINX configuration for frontend + API
## Domain: manfadasia.com / www.manfadasia.com
## Place this file (e.g. /etc/nginx/conf.d/manafadasia.conf) and reload nginx.

## Redirect ALL http traffic to https (replace certificate provisioning with your ACME setup)
server {
    listen 80;
    listen [::]:80;
    server_name manfadasia.com www.manfadasia.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt; # ensure this path exists for certbot
    }

    # Redirect www to apex to avoid duplicate content (choose one canonical)
    if ($host = www.manfadasia.com) {
        return 301 https://manfadasia.com$request_uri;
    }

    # General HTTP → HTTPS redirect
    return 301 https://manfadasia.com$request_uri;
}

## Primary HTTPS server (replace ssl_* paths with real cert files)
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name manfadasia.com;

    # SSL configuration (replace with actual certbot output)
    ssl_certificate     /etc/letsencrypt/live/manfadasia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manfadasia.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/manfadasia.com/chain.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'EECDH+AESGCM:EECDH+CHACHA20:!AES128-SHA:!AES256-SHA:!RC4:!3DES:!MD5:!DSS';
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers (aligned with Express additions)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-site always;
    # Optional: enable COEP if all subresources send CORP headers
    # add_header Cross-Origin-Embedder-Policy require-corp always;

    # Root points to built frontend assets (adjust path to your deployment target)
    root /var/www/mystore/client/dist;
    index index.html;

    # Gzip / brotli (ensure modules compiled)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Serve static assets with long cache (fingerprinted files)
    location ~* \.(?:js|css|woff2|woff|ttf|svg|png|jpe?g|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Shorter cache for HTML / PWA manifest
    location = /manifest.webmanifest { 
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /sw.js { 
        add_header Cache-Control "public, max-age=900";
        try_files $uri =404;
    }

    # SPA fallback – allow API requests to bypass
    location /api/ {
        proxy_pass http://127.0.0.1:8829/;  # Express API port
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disable caching for API
        add_header Cache-Control "no-store";
    }

    location /events {
        proxy_pass http://127.0.0.1:8829/events; # SSE endpoint
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header Host $host;
    }

    # Handle ACME renewal over HTTPS too (optional)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # SPA: fallback all unmatched routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
